---
layout: default
---

<article>

  {% if page.image %}
  <img
    src="{{ page.image | relative_url }}"
    alt="{{ page.title }}"
    style="width:100%; max-height:450px; object-fit:cover; margin-bottom:25px;"
  >
  {% endif %}

  <h1>{{ page.title }}</h1>

  <div class="post-date">
    {{ page.date | date: "%B %d, %Y" }}
  </div>

  {{ content }}

</article>
