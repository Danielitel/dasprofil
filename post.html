---
layout: default
---

<article>

  {% if page.image %}
    <div class="featured-image">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
  {% endif %}

  <h1>{{ page.title }}</h1>

  <div class="post-date">
    {{ page.date | date: "%B %d, %Y" }}
  </div>

  <div class="article-content">
    {{ content }}
  </div>

</article>
