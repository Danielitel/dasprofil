---
layout: default
---

<article>

  {% if page.image %}
  <img
    src="{{ page.image | relative_url }}"
    alt="{{ page.title }}"
    style="width:100%; height:auto; display:block; margin-bottom:25px;"
  >
  {% endif %}

  <h1>{{ page.title }}</h1>

  <div class="post-date">
    {{ page.date | date: "%B %d, %Y" }}
  </div>

  <div class="article-content">
    {{ content }}
  </div>

</article>
