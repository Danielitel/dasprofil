---
layout: default
---

<article>

  <img src="{{ '/assets/images/welcome.jpg.jpeg' | relative_url }}"
       alt="{{ page.title }}"
       style="width:100%; max-width:900px; height:auto; display:block; margin-bottom:25px;">

  <h1>{{ page.title }}</h1>

  <div class="post-date">
    {{ page.date | date: "%B %d, %Y" }}
  </div>

  <div class="article-content">
    {{ content }}
  </div>

</article>
