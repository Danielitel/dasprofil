---
layout: default
---

<article>

  {% if page.image %}
  <img
    src="{{ page.image | relative_url }}"
    alt="{{ page.title }}"
    class="article-featured-image"
  >
  {% endif %}

  <div class="article-header">

    {% if page.category %}
    <div class="article-category">
      {{ page.category }}
    </div>
    {% endif %}

    <h1>{{ page.title }}</h1>

    <div class="article-meta">
      <span>{{ page.date | date: "%B %d, %Y" }}</span>
    </div>

  </div>

  <div class="article-content">
    {{ content }}
  </div>

</article>
