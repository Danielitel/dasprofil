
backend:
  name: turbo-github
  turbo_site_id: 9da0b3d3-3aa0-401d-bbcc-208780ef8c5b
  branch: main

site_url: https://www.dasprofil.jo3.org
display_url: https://www.dasprofil.jo3.org

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: posts
    label: Celebrity Articles
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: Layout
        name: layout
        widget: hidden
        default: post
      - label: Headline
        name: title
        widget: string
      - label: Short Description
        name: description
        widget: text
      - label: Publication Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD MMMM YYYY"
        time_format: false
      - label: Category
        name: category
        widget: select
        options:
          - Biography
          - Entertainment
          - Lifestyle
          - News
          - Trending
        required: false
      - label: Featured Image
        name: image
        widget: image
        required: false
      - label: Article
        name: body
        widget: markdown
